<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Competitor Intelligence Engine</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#111; color:#eee; font-family:'Inter','Segoe UI',sans-serif; display:flex; flex-direction:column; height:100vh; }

    /* ── Top bar with button ────────────────────────────────────── */
    .header { padding:0.8rem 1rem; background:linear-gradient(135deg,#1a1a2e,#16213e); display:flex; justify-content:center; align-items:center; gap:1rem; }
    .header button {
      background:linear-gradient(135deg,#0ea5e9,#6366f1); color:#fff; border:none; border-radius:8px;
      padding:0.65rem 1.6rem; font-size:0.95rem; font-weight:700; cursor:pointer;
      letter-spacing:0.3px; transition:transform .2s, box-shadow .2s;
    }
    .header button:hover { transform:scale(1.05); box-shadow:0 0 14px rgba(14,165,233,.45); }
    .header button:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }

    /* ── Progress panel (hidden by default) ─────────────────────── */
    #scrapeProgress {
      display:none;                      /* JS toggles to "flex" */
      flex-direction:column; align-items:center; gap:0.35rem;
      padding:0.6rem 1rem; background:#1e293b; color:#94a3b8; font-size:0.85rem;
    }
    #scrapeProgress.visible { display:flex; }   /* class-based toggle */
    #progressText { font-weight:600; color:#e2e8f0; }
    .progress-track { background:#334155; height:6px; width:60%; min-width:280px; border-radius:3px; overflow:hidden; }
    #progressFill  { background:linear-gradient(90deg,#0ea5e9,#6366f1); height:100%; width:0%; transition:width .4s ease; border-radius:3px; }

    /* ── Log area (live lines from the engine) ──────────────────── */
    #logArea {
      display:none; max-height:120px; overflow-y:auto; margin:0 auto; width:60%; min-width:280px;
      padding:0.4rem 0.6rem; background:#0f172a; border:1px solid #334155; border-radius:4px;
      font-family:'Cascadia Code','Fira Code',monospace; font-size:0.72rem; color:#64748b; line-height:1.5;
    }
    #logArea.visible { display:block; }

    /* ── Report iframe ──────────────────────────────────────────── */
    iframe { flex:1; border:none; width:100%; }
  </style>
</head>
<body>

  <!-- Top bar — button only, nothing else touched -->
  <div class="header">
    <button id="runScrapeBtn">▶ Run Real‑Time Scrape (Zameen.com)</button>
  </div>

  <!-- Progress panel — hidden until user clicks the button -->
  <div id="scrapeProgress">
    <span id="progressText">Waiting…</span>
    <div class="progress-track"><div id="progressFill"></div></div>
  </div>
  <pre id="logArea"></pre>

  <!-- Existing report — untouched -->
  <iframe id="reportIframe" src="modules/data/competitor_report.html"></iframe>

  <script src="/static/js/competitor_sse.js"></script>
</body>
</html>
